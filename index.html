<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Store</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script src="index.js" defer></script>
</head>

<body>

    <!-- Navbar  -->
    <div class="navbar bg-base-100 shadow-sm">

        <div class="flex-1">
            <a class="btn btn-ghost text-xl">daisyUI</a>
        </div>

        <div class="flex gap-2">

            <input type="text" placeholder="Search" class="input w-24 md:w-auto" />

            <div class="dropdown dropdown-end">

                <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
                    <div class="w-10 rounded-full">

                        <img alt="Profile"
                            src="https://img.daisyui.com/images/stock/photo-1534528741775-53994a69daeb.webp" />

                    </div>
                </div>

                <ul tabindex="-1"
                    class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
                    <li>
                        <a class="justify-between">
                            Profile
                            <span class="badge">New</span>
                        </a>
                    </li>

                    <li>
                        <a>Settings</a>
                    </li>

                    <li>
                        <a>Logout</a>
                    </li>
                </ul>

            </div>

        </div>
    </div>


    <!-- Main Section -->
    <div class="flex gap-5 mt-5">


        <!-- Product Section -->
        <div class="w-3/4">

            <h2 class="text-2xl font-semibold">
                Product List
            </h2>

            <!-- Products will be added here by JavaScript -->
            <div id="product-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 mt-5">
            </div>

        </div>


        <!-- Cart Section -->
        <div class="w-1/4">

            <h2 class="text-2xl font-semibold">
                Cart
            </h2>

            <!-- Cart items will be added here by JavaScript -->
            <div id="cart-container" class="mt-5">
            </div>

            <div id="total-price" class="text-2xl font-bold">
                Total: $0.00
            </div>

        </div>

    </div>

</body>

</html>
